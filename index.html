<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BYS Tracker</title>
<!-- BUILD v3.0 / 2026-05-27 / leader-only -->
<script>window.APP_VERSION = 'v3.0';</script>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #fafafa;
  --paper: #f4f4f4;
  --text: #1a1a1a;
  --text-soft: #333;
  --muted: #888;
  --muted-2: #b8b8b8;
  --line: #e6e6e6;
  --line-soft: #f0f0f0;
  --primary: #2A9D8F;
  --primary-soft: rgba(42, 157, 143, 0.10);
  --danger: #e63946;
  --success: #06d6a0;
  --warn-bg: #fff8ee;
  --sh-sm: 0 1px 2px rgba(0,0,0,0.05);
  --sh: 0 4px 12px rgba(0,0,0,0.08);
  --sh-lg: 0 12px 32px rgba(0,0,0,0.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-soft);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea {
  font-family: inherit; font-size: inherit; color: inherit;
}
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }

/* Topbar */
.topbar {
  background: var(--bg); border-bottom: 1px solid var(--line-soft);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.topbar .brand-mark { color: var(--primary); margin-right: 4px; }
.topbar .right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted-2); }

.container { max-width: 900px; margin: 0 auto; padding: 24px 20px 100px; }
@media (max-width: 640px) { .container { padding: 16px 14px 100px; } }

/* Common: Buttons */
.btn {
  padding: 12px 20px; border-radius: 10px;
  font-weight: 600; font-size: 15px;
  transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: white; }
.btn.primary:hover { opacity: 0.92; }
.btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--paper); }
.btn.danger { background: var(--danger); color: white; }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
.btn.icon { padding: 8px 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* Progress bar */
.progress {
  position: relative; height: 8px; background: var(--line-soft);
  border-radius: 999px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 999px;
  background: var(--primary); transition: width .3s;
}
.progress-wrap {
  display: flex; align-items: center; gap: 10px;
}
.progress-wrap .progress { flex: 1; }
.progress-wrap .pct {
  font-weight: 700; font-size: 14px;
  color: var(--text-soft); flex-shrink: 0;
  min-width: 42px; text-align: right;
}

/* Loading + Empty */
.loading, .empty, .error {
  padding: 60px 20px; text-align: center;
  color: var(--muted);
}
.error { color: var(--danger); }

/* ==== GATE (password screen) ==== */
.gate {
  min-height: 60vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
}
.gate h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: -0.02em; }
.gate p { color: var(--muted); margin-bottom: 30px; }
.gate input {
  padding: 16px 20px; border: 1.5px solid var(--line);
  border-radius: 12px; font-size: 20px;
  width: 240px; text-align: center;
  letter-spacing: 0.4em;
}
.gate input:focus { outline: none; border-color: var(--primary); }
.gate .btn { margin-top: 16px; width: 240px; }

/* ==== ADMIN DASHBOARD ==== */
.admin-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; gap: 12px; flex-wrap: wrap;
}
.admin-header h1 {
  font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
}
.admin-header .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.clubs-list { display: flex; flex-direction: column; gap: 12px; }

.club-card {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden;
  transition: box-shadow .15s;
}
.club-card:hover { box-shadow: var(--sh-sm); }
.club-card.open { box-shadow: var(--sh); }

.card-head {
  padding: 16px 18px; display: flex; align-items: center; gap: 14px;
  cursor: pointer; user-select: none;
}
.card-caret {
  width: 20px; height: 20px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted-2); transition: transform .2s;
  font-size: 12px;
}
.club-card.open .card-caret { transform: rotate(90deg); }
.club-color {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  background: var(--primary);
}
.card-title { flex: 1; font-weight: 700; font-size: 16px; }
.card-progress-mini {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.card-progress-mini .bar {
  width: 60px; height: 6px; background: var(--line-soft);
  border-radius: 999px; overflow: hidden;
}
.card-progress-mini .fill { height: 100%; background: var(--primary); }
.card-progress-mini .pct-mini {
  font-weight: 600; font-size: 13px; color: var(--text-soft);
  min-width: 34px; text-align: right;
}

.card-body {
  display: none; padding: 4px 18px 18px;
  border-top: 1px solid var(--line-soft);
}
.club-card.open .card-body { display: block; }

.info-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 8px 20px; margin-top: 14px;
  font-size: 14px;
}
.info-grid .k { color: var(--muted); }
.info-grid .v { color: var(--text); font-weight: 500; }

.leader-url-box {
  margin-top: 14px; padding: 10px 14px;
  background: var(--bg-soft); border-radius: 8px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--muted);
  overflow: hidden;
}
.leader-url-box .url {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: ui-monospace, monospace; color: var(--text-soft);
}

/* ==== LEADER VIEW ==== */
.leader-topbar {
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font-size: 14px;
  margin-bottom: 20px;
}
.leader-topbar a { color: var(--primary); font-weight: 500; }

.leader-header {
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line-soft);
}
.leader-header .title-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px;
}
.leader-header .title-dot {
  width: 14px; height: 14px; border-radius: 50%;
}
.leader-header h1 {
  font-size: 28px; font-weight: 800;
  letter-spacing: -0.025em; line-height: 1.25;
}
.leader-header .meta {
  color: var(--muted); font-size: 14px;
  margin-bottom: 18px;
}
.leader-header .meta b { color: var(--text-soft); font-weight: 600; }
.leader-header .progress-lg {
  display: flex; align-items: center; gap: 14px;
}
.leader-header .progress-lg .progress {
  flex: 1; height: 12px;
}
.leader-header .progress-lg .pct-big {
  font-size: 22px; font-weight: 800;
  color: var(--primary); min-width: 60px; text-align: right;
}
.leader-header .current-week-badge {
  display: inline-block; padding: 4px 10px;
  background: var(--primary-soft); color: var(--primary);
  border-radius: 6px; font-size: 12px; font-weight: 700;
  margin-left: 6px;
}

.toggle-row {
  margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
  color: var(--muted); font-size: 14px;
}
.toggle-row label { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
.toggle-row input { width: 18px; height: 18px; accent-color: var(--primary); }

/* ==== LEADER: VIEW TABS (오늘 체크 / 전체보기) ==== */
.view-tabs {
  display: flex; gap: 18px; margin-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.tab-btn {
  padding: 10px 2px; margin-bottom: -1px;
  font-weight: 700; font-size: 15px; color: var(--muted);
  border-bottom: 2px solid transparent;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--primary); }

/* ==== LEADER: TODAY QUICK-CHECK LIST ==== */
.today-heading {
  font-weight: 700; font-size: 15px; color: var(--text); margin-bottom: 10px;
}
.today-heading-date { color: var(--muted); font-weight: 500; }
.today-list {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 10px; margin-bottom: 24px;
}
@media (max-width: 640px) {
  .today-list { grid-template-columns: repeat(2, 1fr); }
}
.today-row {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: var(--bg); border: 1px solid var(--line-soft);
  border-radius: 14px; padding: 12px 8px; text-align: center;
}
.today-row .name {
  font-weight: 700; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.today-row .m-progress { font-size: 11px; color: var(--muted); }
.today-row .m-progress b { color: var(--text-soft); font-weight: 700; }
.today-cell {
  flex: 0 0 auto; min-width: 64px; min-height: 64px;
  padding: 6px; border-radius: 14px;
}
.today-cell .cell-value.circle::before,
.today-cell .cell-value.pending::before { width: 26px; height: 26px; }
.today-cell .cell-value { font-size: 22px; }
.today-note {
  font-size: 12px; color: var(--muted-2); padding: 10px 4px;
}
.today-note.done { color: var(--primary); font-weight: 700; }

/* ==== BOARD: 전체 현황판 (읽기 전용, 멤버 공유용) ==== */
.board-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.board-row {
  background: var(--bg); border: 1px solid var(--line-soft);
  border-radius: 14px; padding: 14px 16px;
}
.board-row-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.board-name {
  font-weight: 700; font-size: 15px; color: var(--primary); flex: 0 0 auto;
  width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.board-row-top .progress { flex: 1; height: 6px; }
.board-pct { font-weight: 800; font-size: 14px; flex: 0 0 auto; width: 38px; text-align: right; }
.board-weeks { display: flex; gap: 6px; }
.board-week {
  flex: 1; height: 10px; border-radius: 4px; background: var(--line-soft);
}
.board-week.tier-1 { background: var(--primary); opacity: 0.25; }
.board-week.tier-2 { background: var(--primary); opacity: 0.5; }
.board-week.tier-3 { background: var(--primary); opacity: 0.75; }
.board-week.tier-4 { background: var(--primary); opacity: 1; }
.board-week.current { box-shadow: 0 0 0 2px var(--text-soft) inset; }

/* Read-only cell (개인 기록 페이지: 클릭 불가) */
.cell.ro { cursor: default; }
.cell.ro:hover { border-color: var(--line); box-shadow: none; }
.cell.ro:active { transform: none; }

/* Week sections — accordion: only the current (or clicked-open) week is expanded */
.week-section {
  margin-bottom: 10px; border: 1px solid var(--line-soft);
  border-radius: 12px; background: var(--bg); overflow: hidden;
}
.week-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; gap: 12px; flex-wrap: wrap;
  cursor: pointer; user-select: none;
}
.week-head-left { display: flex; align-items: baseline; gap: 2px; }
.week-caret {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; margin-right: 6px; color: var(--muted-2); font-size: 11px;
  transition: transform .2s;
}
.week-section.open .week-caret { transform: rotate(90deg); }
.week-head .w-label {
  font-size: 18px; font-weight: 800;
  color: var(--text); letter-spacing: -0.02em;
}
.week-head .w-dates {
  color: var(--muted); font-size: 12px;
  margin-left: 8px;
}
.week-head .w-progress {
  font-size: 13px; color: var(--muted-2);
}
.week-head .w-progress b { color: var(--text); font-weight: 700; }
.week-head.is-current .w-label { color: var(--primary); }
.week-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line-soft); }
.week-section.open .week-body {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px; padding-top: 10px;
}
@media (max-width: 640px) {
  .week-section.open .week-body { grid-template-columns: 1fr; }
}

.member-block {
  background: var(--bg); border: 1px solid var(--line-soft);
  border-radius: 10px; padding: 8px;
  display: flex; align-items: center; gap: 6px;
  min-width: 0;
}
.member-block .name-col { flex: 0 0 auto; width: 46px; overflow: hidden; }
.member-block .name {
  font-weight: 600; font-size: 12px; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.member-block .m-progress {
  font-size: 9px; color: var(--muted);
}
.member-block .m-progress b { color: var(--text-soft); font-weight: 700; }
/* 7칸이 항상 한 줄에 다 보이도록, 잘리는 대신 칸 자체가 남은 폭에 맞춰 줄어든다 */
.member-block .cell-row { flex: 1; flex-wrap: nowrap; min-width: 0; }
.member-block .cell-row .cell { flex: 1 1 0; min-width: 0; padding: 5px 1px; }
.member-block .cell-row .cell-date { font-size: 9px; }

.cell-row {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.cell {
  flex: 0 0 auto;
  min-width: 50px;
  padding: 6px 4px;
  background: var(--bg-soft);
  border: 1.5px solid var(--line);
  border-radius: 9px;
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  transition: transform .1s, background .15s;
}
.cell:active { transform: scale(0.94); }
.cell.done {
  background: var(--primary); border-color: var(--primary); color: white;
}
.cell.done .cell-date { color: rgba(255,255,255,0.85); }
.cell-value {
  font-size: 15px; font-weight: 700; min-height: 17px;
  display: flex; align-items: center;
}
.cell-value.circle::before {
  content: ''; display: block; width: 15px; height: 15px;
  border-radius: 50%; background: currentColor;
}
.cell-value.pending::before {
  content: ''; display: block; width: 15px; height: 15px;
  border-radius: 50%; border: 2px solid var(--muted-2);
  background: transparent;
}
.cell-date {
  font-size: 10px; font-weight: 500; color: var(--muted);
  min-height: 13px;
}

@media (max-width: 640px) {
  .cell { min-width: 40px; padding: 5px 2px; }
  .cell-value { font-size: 13px; }
}

/* ==== MODAL ==== */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 1000; padding: 20px;
  animation: fadeIn .15s;
}
@media (min-width: 640px) { .modal-bg { align-items: center; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg); border-radius: 20px 20px 0 0;
  max-width: 480px; width: 100%;
  max-height: 85vh; overflow-y: auto;
  animation: slideUp .2s;
}
@media (min-width: 640px) { .modal { border-radius: 20px; } }
@keyframes slideUp { from { transform: translateY(30px); } to { transform: translateY(0); } }
.modal-header {
  padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 18px; font-weight: 700; }
.modal-close {
  color: var(--muted); font-size: 24px; padding: 4px 8px;
}
.modal-body { padding: 12px 20px 20px; }

.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-weight: 600; font-size: 14px;
  color: var(--text-soft); margin-bottom: 8px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: 10px;
  font-size: 15px; background: var(--bg);
  transition: border-color .15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary);
}
.form-group .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.form-row { display: flex; gap: 10px; }
.form-row > * { flex: 1; }

.weekday-picker {
  display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;
}
.weekday-picker label {
  flex: 1; min-width: 40px;
  padding: 10px 6px; border: 1.5px solid var(--line);
  border-radius: 10px; text-align: center;
  cursor: pointer; user-select: none;
  font-weight: 600; font-size: 14px;
  transition: all .15s;
}
.weekday-picker input { display: none; }
.weekday-picker input:checked + span,
.weekday-picker label.checked {
  background: var(--primary); color: white; border-color: var(--primary);
}

.color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  transition: transform .1s;
}
.color-swatch.selected { border-color: var(--text); transform: scale(1.15); }

.member-list {
  margin-top: 10px; display: flex; flex-direction: column; gap: 6px;
}
.member-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--bg-soft); border-radius: 8px;
}
.member-row .name { flex: 1; font-size: 14px; font-weight: 500; }
.member-row .del {
  color: var(--danger); font-size: 12px; padding: 4px 8px;
}

.type-selector {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-top: 4px;
}
.type-selector label {
  padding: 12px 8px; text-align: center;
  border: 1.5px solid var(--line); border-radius: 10px;
  cursor: pointer; user-select: none;
  transition: all .15s;
}
.type-selector input { display: none; }
.type-selector label.checked {
  background: var(--primary); color: white; border-color: var(--primary);
}
.type-selector .t-emoji { font-size: 20px; display: block; margin-bottom: 4px; }
.type-selector .t-name { font-size: 13px; font-weight: 600; }

.mode-toggle {
  display: flex; gap: 8px; margin-top: 4px;
}
.mode-toggle label {
  flex: 1; padding: 10px; text-align: center;
  border: 1.5px solid var(--line); border-radius: 10px;
  cursor: pointer; user-select: none; font-weight: 600;
  transition: all .15s;
}
.mode-toggle input { display: none; }
.mode-toggle label.checked {
  background: var(--primary); color: white; border-color: var(--primary);
}

.number-input-large {
  font-size: 32px; text-align: center; padding: 20px !important;
  letter-spacing: -0.02em;
}

.count-controls {
  display: flex; align-items: center; justify-content: center; gap: 20px;
  padding: 20px 0;
}
.count-btn {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--paper); font-size: 24px; font-weight: 700;
  transition: transform .1s;
}
.count-btn:active { transform: scale(0.9); }
.count-btn.primary { background: var(--primary); color: white; }
.count-display {
  font-size: 48px; font-weight: 800; min-width: 80px; text-align: center;
  color: var(--text); letter-spacing: -0.02em;
}

.modal-actions {
  padding: 14px 20px 20px; display: flex; gap: 10px;
  border-top: 1px solid var(--line-soft);
}
.modal-actions .btn { flex: 1; }

/* Toast */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: white;
  padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s;
  max-width: 90vw; text-align: center; z-index: 1500;
}
#toast.show { opacity: 1; }
#toast.err { background: var(--danger); }

/* Save indicator */
.save-state {
  color: var(--muted-2); font-size: 12px;
  opacity: 0; transition: opacity .15s;
}
.save-state.show { opacity: 1; }
.save-state.err { color: var(--danger); }

/* Debug panel */
#dbg-btn {
  position: fixed; bottom: 12px; right: 12px;
  width: 44px; height: 44px; border-radius: 50%;
  background: #222; color: white; font-size: 20px;
  z-index: 9999; box-shadow: var(--sh);
}
#dbg-panel {
  display: none; position: fixed;
  bottom: 66px; right: 12px; left: 12px;
  max-width: 480px; margin-left: auto;
  max-height: 60vh; overflow-y: auto;
  background: rgba(0,0,0,0.92); color: #0f0;
  font: 11px/1.4 ui-monospace, monospace;

// ============ CACHE ============
let cache = { users: [], clubs: [], memberships: [], entries: [], loaded: false, loading: null };

async function loadAll() {

}
function invalidateCache() { cache.loaded = false; cache.loading = null; }

// ============ HELPERS ============
function findUser(id) { return cache.users.find(u => u.id === id); }
function findClub(id) { return cache.clubs.find(c => c.id === id); }
function findMembership(id) { return cache.memberships.find(m => m.id === id); }
function membershipsOfClub(clubId) { return cache.memberships.filter(m => m.club_id === clubId); }
function clubByLeaderToken(t) { return cache.clubs.find(c => c.leader_token === t); }
function entryOf(mid, week, slot) {
  return cache.entries.find(e => e.membership_id === mid && e.week === week && e.slot === slot);
}
function entriesOfMembership(mid) { return cache.entries.filter(e => e.membership_id === mid); }
function entriesOfClub(clubId) {
  const mids = new Set(membershipsOfClub(clubId).map(m => m.id));
  return cache.entries.filter(e => mids.has(e.membership_id));
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

// Date helpers
function parseDate(s) {
  if (!s) return null;
  if (s instanceof Date) return s;
  const parts = String(s).split('-');
  if (parts.length === 3) {
    return new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
  }
  return new Date(s);
}
function addDays(d, n) {
  const r = new Date(d.getTime());
  r.setUTCDate(r.getUTCDate() + n);
  return r;
}
function dateStr(d) {
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const day = String(d.getUTCDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function fmtDateShort(d) {
  return (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
}
function fmtDateWithDay(d) {
  return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '(' + WEEKDAY_LABELS[d.getUTCDay()] + ')';
}
function fmtDateFull(d) {
  return d.getUTCFullYear() + '년 ' + (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일';
}
function fmtDateMonthDayWeekdayKR(d) {
  return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + WEEKDAY_LABELS[d.getUTCDay()] + '요일)';
}

function getClubPeriod(club) {
  const start = parseDate(club.start_date);
  if (!start) return { start: null, end: null };
  const end = addDays(start, 8 * 7 - 1);
  return { start, end };
}
function getCurrentWeek(club) {
  const start = parseDate(club.start_date);
  if (!start) return null;
  const today = new Date();
  today.setUTCHours(0, 0, 0, 0);
  const days = Math.floor((today - start) / 86400000);
  if (days < 0) return null;
  const week = Math.floor(days / 7) + 1;
  if (week > 8) return null;
  return week;
}
function getWeekRange(club, week) {
  const start = parseDate(club.start_date);
  const s = addDays(start, (week - 1) * 7);
  const e = addDays(s, 6);
  return { start: s, end: e };
}

// 주 7회(매일)는 '자유' 모드여도 어느 요일을 고를지 선택의 여지가 없으므로,
// 슬롯 순서를 그 주의 날짜 순서로 확정한다. 진짜 자유 모드(주 7회 미만)만
// "체크한 날짜가 곧 그 칸의 날짜"로 남는다.
function isDeterministicSchedule(club) {
  return club.frequency_mode === 'fixed' || (club.frequency_per_week || 7) >= 7;
}

// Slot date: 고정/매일 모드는 요일로 계산, 진짜 자유 모드는 저장된 entry 날짜를 그대로 사용
function getSlotDate(club, week, slot, entry) {
  if (club.frequency_mode === 'fixed' && club.fixed_days && club.fixed_days.length) {
    const range = getWeekRange(club, week);
    const sorted = [...club.fixed_days].sort((a,b) => a - b);
    const dow = sorted[slot];
    if (dow === undefined) return null;
    const startDow = range.start.getUTCDay();
    const offset = (dow - startDow + 7) % 7;
    return addDays(range.start, offset);
  }
  if ((club.frequency_per_week || 7) >= 7) {
    const range = getWeekRange(club, week);
    return addDays(range.start, slot);
  }
  return entry && entry.date ? parseDate(entry.date) : null;
}

// Progress
function hasValue(entry) {
  if (!entry || !entry.value) return false;
  const v = entry.value;
  if (v.state === 'done') return true;
  if (typeof v.n === 'number' && !isNaN(v.n)) return true;
  if (typeof v.count === 'number' && v.count > 0) return true;
  return false;
}
function membershipProgress(membership, club) {
  const total = 8 * (club.frequency_per_week || 7);
  const filled = entriesOfMembership(membership.id).filter(hasValue).length;
  return { filled, total, pct: total ? Math.round(filled / total * 100) : 0 };
}
function membershipWeekProgress(membership, club, week) {
  const total = club.frequency_per_week || 7;
  const filled = cache.entries.filter(e =>
    e.membership_id === membership.id && e.week === week && hasValue(e)
  ).length;
  return { filled, total, pct: total ? Math.round(filled / total * 100) : 0 };
}

// Is today one of this club's activity days? (고정/매일 모드만 요일이 정해져 있음; 진짜 자유 모드는 "항상 가능")
function isTodayScheduled(club, currentWeek) {
  if (!currentWeek) return false;
  if (!isDeterministicSchedule(club)) return true;
  const todayStr = dateStr(new Date());
  const freq = club.frequency_per_week || 7;
  for (let s = 0; s < freq; s++) {
    const d = getSlotDate(club, currentWeek, s, null);
    if (d && dateStr(d) === todayStr) return true;
  }
  return false;
}

// Resolve which (week, slot) represents "today" for a membership, for the 오늘 체크 quick view
function getTodaySlotInfo(club, membership, currentWeek) {
  const todayStr = dateStr(new Date());
  const freq = club.frequency_per_week || 7;
  if (isDeterministicSchedule(club)) {
    for (let s = 0; s < freq; s++) {
      const d = getSlotDate(club, currentWeek, s, null);
      if (d && dateStr(d) === todayStr) {
        return { status: 'today', week: currentWeek, slot: s, entry: entryOf(membership.id, currentWeek, s) };
      }
    }
    return { status: 'week-complete' };
  }
  // 진짜 자유 모드: 오늘 날짜로 이미 기록된 슬롯 우선, 없으면 다음 빈 슬롯
  for (let s = 0; s < freq; s++) {
    const entry = entryOf(membership.id, currentWeek, s);
    if (entry && entry.date === todayStr) {
      return { status: 'today', week: currentWeek, slot: s, entry };
    }
  }
  for (let s = 0; s < freq; s++) {
    const entry = entryOf(membership.id, currentWeek, s);
    if (!hasValue(entry)) {
      return { status: 'today', week: currentWeek, slot: s, entry };
    }
  }
  return { status: 'week-complete' };
}

function clubProgress(club) {
  const memberships = membershipsOfClub(club.id);
  if (!memberships.length) return { filled: 0, total: 0, pct: 0 };
  const total = memberships.length * 8 * (club.frequency_per_week || 7);
  const filled = entriesOfClub(club.id).filter(hasValue).length;
  return { filled, total, pct: total ? Math.round(filled / total * 100) : 0 };
}
function clubWeekProgress(club, week) {
  const memberships = membershipsOfClub(club.id);
  const total = memberships.length * (club.frequency_per_week || 7);
  const mids = new Set(memberships.map(m => m.id));
  const filled = cache.entries.filter(e =>
    mids.has(e.membership_id) && e.week === week && hasValue(e)
  ).length;
  return { filled, total, pct: total ? Math.round(filled / total * 100) : 0 };
}

// Token gen
function slug(s) {
  return String(s || '').toLowerCase()
    .replace(/[^a-z0-9가-힣]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 20) || 'club';
}
function randomToken(len) {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function genLeaderToken(clubName) {
  return 'lead-' + slug(clubName) + '-' + randomToken(8);
}
function genMemberToken() { return 't' + randomToken(12); }

// ============ TOAST + SAVE STATE ============
let toastTimer, saveStateTimer;
function toast(msg, isErr) {
  const t = document.getElementById('toast');

// ============ DEBUG PANEL ============
window._dbgLog = [];
function dbg(msg) {
  const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const entry = '[' + t + '] ' + msg;
  window._dbgLog.unshift(entry);
  if (window._dbgLog.length > 40) window._dbgLog.length = 40;

  };

// ============ PENDING SAVE QUEUE ============
const PENDING_KEY = 'bys.v3.pending';
function pendingGet() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch { return []; }
}
function pendingSet(arr) {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(arr)); } catch {}
}
function pendingAdd(op) {
  const q = pendingGet();
  const filtered = q.filter(x => !(
    x.membership_id === op.membership_id && x.week === op.week && x.slot === op.slot
  ));
  filtered.push(op);
  pendingSet(filtered);
  dbg('큐 추가: W' + op.week + 'S' + op.slot + ' (큐 ' + filtered.length + ')');
}
function pendingRemove(op) {
  const q = pendingGet();
  const filtered = q.filter(x => !(
    x.membership_id === op.membership_id && x.week === op.week && x.slot === op.slot && x.ts === op.ts
  ));
  pendingSet(filtered);
}
let _flushing = false;
async function pendingFlush() {
  if (_flushing) return;
  const q = pendingGet();
  if (!q.length) return;
  _flushing = true;
  dbg('🔁 큐 flush 시작 (' + q.length + '개)');
  let anySuccess = false;
  for (const op of q.slice()) {
    try {
      if (op.action === 'delete') {
        const { error } = await sb.from('entries').delete()
          .eq('membership_id', op.membership_id).eq('week', op.week).eq('slot', op.slot);
        if (error) throw error;
      } else {
        const { error } = await sb.from('entries').upsert({
          membership_id: op.membership_id, week: op.week, slot: op.slot,
          date: op.date, value: op.value, updated_at: op.ts
        }, { onConflict: 'membership_id,week,slot' });
        if (error) throw error;
      }
      pendingRemove(op);
      anySuccess = true;
    } catch (e) {
      dbg('  ❌ flush 실패 W' + op.week + 'S' + op.slot + ': ' + (e.message || e));
    }
  }
  _flushing = false;
  if (anySuccess) {
    invalidateCache();
    try { await loadAll(); route({ preserveScroll: true }); } catch {}
  }
}
window.addEventListener('online', pendingFlush);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') pendingFlush();
});

// ============ MODAL ============
function showModal(title, bodyHtml, options) {
  options = options || {};
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML =
    '<div class="modal">' +
      '<div class="modal-header">' +
        '<h3>' + escapeHtml(title) + '</h3>' +
        '<button class="modal-close" data-close>×</button>' +
      '</div>' +
      '<div class="modal-body">' + bodyHtml + '</div>' +
      (options.actions !== false ?
        '<div class="modal-actions">' +
          '<button class="btn ghost" data-cancel>' + (options.cancelText || '취소') + '</button>' +
          '<button class="btn primary" data-save>' + (options.saveText || '저장') + '</button>' +
        '</div>' : '') +
    '</div>';
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
  bg.querySelector('[data-close]').addEventListener('click', close);
  const cancelBtn = bg.querySelector('[data-cancel]');
  const saveBtn = bg.querySelector('[data-save]');
  if (cancelBtn) cancelBtn.addEventListener('click', close);
  if (saveBtn && options.onSave) {
    saveBtn.addEventListener('click', async () => {
      const r = await options.onSave(bg);
      if (r !== false) close();
    });
  }
  const escHandler = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
  if (options.onMount) options.onMount(bg);
  return { modal: bg, close };
}

// ============ ROUTING ============
async function route(opts) {
  opts = opts || {};
  const hash = location.hash || '#/';
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  if (!cache.loaded) {
    app.innerHTML = '<div class="loading">불러오는 중…</div>';
  }
  dbgInit();
  try {
    await loadAll();
  } catch (e) {
    console.error(e);
    dbg('❌ 로드 실패: ' + (e.message || e));
    app.innerHTML = '<div class="error">데이터 로드 실패: ' + escapeHtml(e.message || String(e)) + '</div>';
    return;
  }
  const pq = pendingGet();
  if (pq.length) {
    dbg('🔁 대기 큐 ' + pq.length + '개 → flush');
    setTimeout(pendingFlush, 100);
  }

  let view;
  try {
    if (hash.startsWith('#/leader/')) {
      view = renderLeader(decodeURIComponent(hash.slice(9)));
    } else if (hash.startsWith('#/board/')) {
      view = renderBoard(decodeURIComponent(hash.slice(8)));
    } else if (hash.startsWith('#/me/')) {
      view = renderMemberPage(decodeURIComponent(hash.slice(5)));
    } else {
      view = adminGatePassed() ? renderAdmin() : renderAdminGate();
    }
  } catch (e) {
    console.error(e);
    view = document.createElement('div');
    view.className = 'error';
    view.textContent = '오류: ' + (e.message || String(e));
  }

  app.innerHTML = '';
  app.appendChild(view);
  window.scrollTo(0, opts.preserveScroll ? scrollY : 0);
}
window.addEventListener('hashchange', route);

  const freqLabel = getFreqLabel(club);

  const leaderUrl = club.leader_token ? (location.origin + location.pathname + '#/leader/' + club.leader_token) : null;
  const boardUrl = club.leader_token ? (location.origin + location.pathname + '#/board/' + club.leader_token) : null;

  card.innerHTML =
    '<div class="card-head">' +
      '<div class="card-caret">▶</div>' +
      '<div class="club-color" style="background:' + escapeHtml(club.color || '#2A9D8F') + '"></div>' +
      '<div class="card-title">' + escapeHtml(club.name || '(이름 없음)') + '</div>' +
      '<div class="card-progress-mini">' +
        '<div class="bar"><div class="fill" style="width:' + prog.pct + '%; background:' + escapeHtml(club.color || '#2A9D8F') + '"></div></div>' +
        '<div class="pct-mini">' + prog.pct + '%</div>' +
      '</div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="info-grid">' +
        '<div class="k">기간</div>' +
        '<div class="v">' + (period.start ? (fmtDateShort(period.start) + ' ~ ' + fmtDateShort(period.end) + (currentWeek ? ' · <span style="color:' + escapeHtml(club.color || '#2A9D8F') + '; font-weight:700;">지금 W' + currentWeek + '</span>' : '')) : '-') + '</div>' +
        '<div class="k">진행 방식</div>' +
        '<div class="v">' + typeLabel + '</div>' +
        '<div class="k">요일 규칙</div>' +
        '<div class="v">' + freqLabel + '</div>' +
        '<div class="k">멤버</div>' +
        '<div class="v">' + memberships.length + '명</div>' +
      '</div>' +
      (leaderUrl ?
        '<div class="leader-url-box">' +
          '<span class="url">' + escapeHtml(leaderUrl) + '</span>' +
          '<button class="btn small ghost" data-copy>복사</button>' +
        '</div>' : '') +
      (boardUrl ?
        '<div class="leader-url-box">' +
          '<span class="url">' + escapeHtml(boardUrl) + '</span>' +
          '<button class="btn small ghost" data-copy-board>복사</button>' +
        '</div>' : '') +
      '<div class="btn-row">' +
        '<a class="btn primary small" href="#/leader/' + escapeHtml(club.leader_token || '') + '">리더 뷰 열기 →</a>' +
        '<a class="btn ghost small" href="#/board/' + escapeHtml(club.leader_token || '') + '">현황판 열기</a>' +
        '<button class="btn ghost small" data-members>멤버 관리</button>' +
        '<button class="btn ghost small" data-edit>편집</button>' +
        '<button class="btn ghost small" data-newtoken>리더 URL 재발급</button>' +
        '<button class="btn ghost small" data-delete style="color:var(--danger);">삭제</button>' +
      '</div>' +
    '</div>';

  // Head: toggle open/closed
  card.querySelector('.card-head').addEventListener('click', () => {
    card.classList.toggle('open');
  });

  // Actions
  const copyBtn = card.querySelector('[data-copy]');
  if (copyBtn) {
    copyBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(leaderUrl);
        toast('리더 URL 복사됨');
      } catch { toast('복사 실패 — 수동으로 선택하세요', true); }
    });
  }
  const copyBoardBtn = card.querySelector('[data-copy-board]');
  if (copyBoardBtn) {
    copyBoardBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(boardUrl);
        toast('현황판 URL 복사됨');
      } catch { toast('복사 실패 — 수동으로 선택하세요', true); }
    });
  }
  card.querySelector('[data-edit]').addEventListener('click', (e) => {
    e.stopPropagation(); openClubModal(club);
  });
  card.querySelector('[data-members]').addEventListener('click', (e) => {
    e.stopPropagation(); openMembersModal(club);
  });
  card.querySelector('[data-newtoken]').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('리더 URL을 새로 발급하면 기존 URL은 사용할 수 없게 됩니다. 계속?')) return;
    const tok = genLeaderToken(club.name);
    const { error } = await sb.from('clubs').update({ leader_token: tok }).eq('id', club.id);
    if (error) return toast('실패: ' + error.message, true);
    invalidateCache(); await loadAll(); route();
    toast('새 리더 URL 발급 완료');
  });
  card.querySelector('[data-delete]').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('정말 "' + club.name + '" 클럽을 삭제할까요? 관련 멤버십/기록이 모두 사라집니다.')) return;
    const { error } = await sb.from('clubs').delete().eq('id', club.id);
    if (error) return toast('실패: ' + error.message, true);
    invalidateCache(); await loadAll(); route();
    toast('삭제됨');
  });

  return card;
}

function getFreqLabel(club) {
  const n = club.frequency_per_week || 7;
  const mode = club.frequency_mode || 'freeform';
  if (mode === 'fixed' && club.fixed_days && club.fixed_days.length) {
    const days = [...club.fixed_days].sort().map(d => WEEKDAY_LABELS[d]).join('/');
    return '주 ' + n + '회 · <b>' + days + '</b> 고정';
  }
  return '주 ' + n + '회 · 자유';
}
function getTypeLabel(club) {
  const t = club.entry_type || 'check';
  if (t === 'number') return '📊 숫자 (' + escapeHtml(club.unit || '') + ')';
  if (t === 'count') return '🔢 횟수';
  return '✅ 체크';
}

// ============ CLUB MODAL (Create / Edit) ============
function openClubModal(club) {
  const isEdit = !!club;
  const c = club || {};
  const bodyHtml =
    '<div class="form-group">' +
      '<label>클럽 이름</label>' +
      '<input type="text" id="cf-name" value="' + escapeHtml(c.name || '') + '" placeholder="예: 계단으로 기초체력">' +
    '</div>' +
    '<div class="form-group">' +
      '<label>리더 이름</label>' +
      '<input type="text" id="cf-leader" value="' + escapeHtml(c.leader_name || '') + '" placeholder="예: 이수경">' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="form-group">' +
        '<label>시작 날짜</label>' +
        '<input type="date" id="cf-start" value="' + escapeHtml(c.start_date || '') + '">' +
      '</div>' +
      '<div class="form-group">' +
        '<label>기간</label>' +
        '<input type="text" value="8주 고정" disabled>' +
      '</div>' +
    '</div>' +
    '<div class="form-group">' +
      '<label>색상</label>' +
      '<div class="color-picker" id="cf-colors">' +
        COLOR_PRESETS.map(cp =>
          '<div class="color-swatch' + (c.color === cp.value ? ' selected' : '') + '" ' +
            'data-color="' + cp.value + '" style="background:' + cp.value + '" title="' + cp.name + '"></div>'
        ).join('') +
      '</div>' +
    '</div>' +
    '<div class="form-group">' +
      '<label>진행 방식</label>' +
      '<div class="type-selector" id="cf-type">' +
        ['check', 'number', 'count'].map(t => {
          const info = { check: {e:'✅', n:'체크'}, number: {e:'📊', n:'숫자'}, count: {e:'🔢', n:'횟수'} }[t];
          const checked = (c.entry_type || 'check') === t;
          return '<label class="' + (checked ? 'checked' : '') + '" data-type="' + t + '">' +
            '<input type="radio" name="type" value="' + t + '"' + (checked ? ' checked' : '') + '>' +
            '<span class="t-emoji">' + info.e + '</span>' +
            '<span class="t-name">' + info.n + '</span>' +
          '</label>';
        }).join('') +
      '</div>' +
      '<div class="hint">체크=완료 여부만 · 숫자=값 입력 (km/층 등) · 횟수=하루 여러 번</div>' +
    '</div>' +
    '<div class="form-group" id="cf-unit-wrap" style="display:' + ((c.entry_type === 'number') ? 'block' : 'none') + ';">' +
      '<label>단위 (숫자형만)</label>' +
      '<input type="text" id="cf-unit" value="' + escapeHtml(c.unit || '') + '" placeholder="예: km, 층, 잔">' +
    '</div>' +
    '<div class="form-group">' +
      '<label>주 몇 회?</label>' +
      '<div class="form-row">' +
        '<select id="cf-freq">' +
          [1,2,3,4,5,6,7].map(n =>
            '<option value="' + n + '"' + ((c.frequency_per_week || 7) === n ? ' selected' : '') + '>주 ' + n + '회</option>'
          ).join('') +
        '</select>' +
      '</div>' +
    '</div>' +
    '<div class="form-group">' +
      '<label>요일 규칙</label>' +
      '<div class="mode-toggle" id="cf-mode">' +
        '<label class="' + ((c.frequency_mode || 'freeform') === 'freeform' ? 'checked' : '') + '" data-mode="freeform"><input type="radio" name="mode" value="freeform"' + ((c.frequency_mode || 'freeform') === 'freeform' ? ' checked' : '') + '>자유 (아무 요일)</label>' +
        '<label class="' + (c.frequency_mode === 'fixed' ? 'checked' : '') + '" data-mode="fixed"><input type="radio" name="mode" value="fixed"' + (c.frequency_mode === 'fixed' ? ' checked' : '') + '>요일 지정</label>' +
      '</div>' +
    '</div>' +
    '<div class="form-group" id="cf-days-wrap" style="display:' + (c.frequency_mode === 'fixed' ? 'block' : 'none') + ';">' +
      '<label>지정 요일 (선택한 개수 = 주 N회)</label>' +
      '<div class="weekday-picker" id="cf-days">' +
        WEEKDAY_LABELS.map((lbl, i) => {
          const checked = (c.fixed_days || []).includes(i);
          return '<label class="' + (checked ? 'checked' : '') + '" data-dow="' + i + '">' +
            '<input type="checkbox" value="' + i + '"' + (checked ? ' checked' : '') + '><span>' + lbl + '</span>' +
          '</label>';
        }).join('') +
      '</div>' +
    '</div>';

  showModal(isEdit ? '클럽 편집' : '새 클럽 만들기', bodyHtml, {
    saveText: isEdit ? '저장' : '만들기',
    onMount: (bg) => {
      // Color picker
      bg.querySelectorAll('.color-swatch').forEach(sw => {
        sw.addEventListener('click', () => {
          bg.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
          sw.classList.add('selected');
        });
      });
      // Type selector
      bg.querySelectorAll('#cf-type label').forEach(lbl => {
        lbl.addEventListener('click', () => {
          bg.querySelectorAll('#cf-type label').forEach(l => l.classList.remove('checked'));
          lbl.classList.add('checked');
          lbl.querySelector('input').checked = true;
          bg.querySelector('#cf-unit-wrap').style.display = lbl.dataset.type === 'number' ? 'block' : 'none';
        });
      });
      // Mode toggle
      bg.querySelectorAll('#cf-mode label').forEach(lbl => {
        lbl.addEventListener('click', () => {
          bg.querySelectorAll('#cf-mode label').forEach(l => l.classList.remove('checked'));
          lbl.classList.add('checked');
          lbl.querySelector('input').checked = true;
          bg.querySelector('#cf-days-wrap').style.display = lbl.dataset.mode === 'fixed' ? 'block' : 'none';
        });
      });
      // Weekday picker
      bg.querySelectorAll('#cf-days label').forEach(lbl => {
        lbl.addEventListener('click', (e) => {
          e.preventDefault();
          const inp = lbl.querySelector('input');
          inp.checked = !inp.checked;
          lbl.classList.toggle('checked', inp.checked);
          const count = bg.querySelectorAll('#cf-days input:checked').length;
          if (count > 0) bg.querySelector('#cf-freq').value = count;
        });
      });
      // Auto-set freq from checked days on load if fixed mode
      if (c.frequency_mode === 'fixed' && c.fixed_days && c.fixed_days.length) {
        bg.querySelector('#cf-freq').value = c.fixed_days.length;
      }
    },
    onSave: async (bg) => {
      const name = bg.querySelector('#cf-name').value.trim();
      const leader = bg.querySelector('#cf-leader').value.trim();
      const startDate = bg.querySelector('#cf-start').value;
      const color = bg.querySelector('.color-swatch.selected')?.dataset.color || '#2A9D8F';
      const type = bg.querySelector('#cf-type input:checked')?.value || 'check';
      const unit = bg.querySelector('#cf-unit').value.trim() || null;
      const freq = parseInt(bg.querySelector('#cf-freq').value, 10);
      const mode = bg.querySelector('#cf-mode input:checked')?.value || 'freeform';
      const fixedDays = Array.from(bg.querySelectorAll('#cf-days input:checked')).map(x => parseInt(x.value, 10));

      if (!name) { toast('클럽 이름을 입력하세요', true); return false; }
      if (!startDate) { toast('시작 날짜를 선택하세요', true); return false; }
      if (mode === 'fixed' && fixedDays.length !== freq) {
        toast('지정 요일 개수(' + fixedDays.length + ')와 주 ' + freq + '회가 맞지 않습니다', true);
        return false;
      }

      const payload = {
        name, leader_name: leader || null,
        start_date: startDate, color,
        entry_type: type,
        unit: type === 'number' ? unit : null,
        frequency_per_week: freq,
        frequency_mode: mode,
        fixed_days: mode === 'fixed' ? fixedDays.sort((a,b) => a - b) : null,
      };
      // Period label (backward compat)
      const s = parseDate(startDate);
      const e = addDays(s, 8 * 7 - 1);
      payload.period = fmtDateShort(s) + ' ~ ' + fmtDateShort(e);

      if (isEdit) {
        const { error } = await sb.from('clubs').update(payload).eq('id', club.id);
        if (error) { toast('저장 실패: ' + error.message, true); return false; }
        toast('저장됨');
      } else {
        payload.leader_token = genLeaderToken(name);
        const { error } = await sb.from('clubs').insert(payload);
        if (error) { toast('생성 실패: ' + error.message, true); return false; }
        toast('클럽 생성 완료');
      }
      invalidateCache(); await loadAll(); route();
      return true;
    }
  });
}

// ============ MEMBERS MODAL ============
function openMembersModal(club) {
  const memberships = membershipsOfClub(club.id);
  const bodyHtml =
    '<div class="form-group">' +
      '<label>새 멤버 추가</label>' +
      '<div class="form-row">' +
        '<input type="text" id="mm-name" placeholder="이름 (예: 김민수)">' +
        '<button class="btn primary" id="mm-add">추가</button>' +
      '</div>' +
      '<div class="hint">여러 명 한 번에: 콤마(,) 또는 줄바꿈으로 구분</div>' +
    '</div>' +
    '<div class="form-group">' +
      '<label>현재 멤버 (' + memberships.length + '명)</label>' +
      '<div class="member-list" id="mm-list"></div>' +
    '</div>';

  showModal(club.name + ' — 멤버 관리', bodyHtml, {
    actions: false,
    onMount: (bg) => {
      const list = bg.querySelector('#mm-list');
      function refresh() {
        const ms = membershipsOfClub(club.id).map(m => ({ m, u: findUser(m.user_id) })).filter(x => x.u);
        ms.sort((a, b) => (a.u.name || '').localeCompare(b.u.name || ''));
        list.innerHTML = ms.length ? ms.map(x =>
          '<div class="member-row" data-mid="' + x.m.id + '">' +
            '<span class="name">' + escapeHtml(x.u.name) + '</span>' +
            '<button class="del" data-link style="color:var(--primary);">내 기록 링크</button>' +
            '<button class="del" data-del>삭제</button>' +
          '</div>'
        ).join('') : '<div class="empty" style="padding:20px;">아직 멤버가 없습니다</div>';
        list.querySelectorAll('[data-link]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const row = btn.closest('.member-row');
            const mid = row.dataset.mid;
            const m = findMembership(mid);
            if (!m) return;
            const url = location.origin + location.pathname + '#/me/' + m.token;
            try {
              await navigator.clipboard.writeText(url);
              toast('개인 기록 링크 복사됨');
            } catch { toast('복사 실패 — 수동으로 선택하세요', true); }
          });
        });
        list.querySelectorAll('[data-del]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const row = btn.closest('.member-row');
            const mid = row.dataset.mid;
            const m = findMembership(mid);
            const u = m && findUser(m.user_id);
            if (!u) return;
            if (!confirm('"' + u.name + '"을(를) 이 클럽에서 삭제할까요? 기록도 함께 사라집니다.')) return;
            const { error } = await sb.from('memberships').delete().eq('id', mid);
            if (error) return toast('실패: ' + error.message, true);
            invalidateCache(); await loadAll();
            refresh();
            toast('삭제됨');
          });
        });
      }
      refresh();

      bg.querySelector('#mm-add').addEventListener('click', async () => {
        const raw = bg.querySelector('#mm-name').value.trim();
        if (!raw) return;
        const names = raw.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
        if (!names.length) return;
        let added = 0, errors = 0;
        for (const name of names) {
          // Find or create user
          let user = cache.users.find(u => u.name === name);
          if (!user) {
            const { data, error } = await sb.from('users').insert({ name, timezone: 'Asia/Seoul' }).select().single();
            if (error) { errors++; continue; }
            user = data;
            cache.users.push(user);
          }
          // Check if already in club
          const existing = cache.memberships.find(m => m.user_id === user.id && m.club_id === club.id);
          if (existing) continue;
          // Create membership
          const { data: md, error: merr } = await sb.from('memberships').insert({
            user_id: user.id, club_id: club.id, token: genMemberToken(),
          }).select().single();
          if (merr) { errors++; continue; }
          cache.memberships.push(md);
          added++;
        }
        bg.querySelector('#mm-name').value = '';
        refresh();
        toast(added + '명 추가' + (errors ? ' · ' + errors + '개 실패' : ''));
        // Also refresh dashboard progress numbers
        setTimeout(() => { invalidateCache(); loadAll(); }, 100);
      });
    }
  });
}

// ============ LEADER VIEW ============
// Per-club sub-view state (오늘 체크 vs 전체보기), kept outside renderLeader so it
// survives the route() re-renders that happen after every save.
let leaderViewMode = {};

// Per-club set of expanded week numbers in 전체보기 (accordion) — defaults to just the current week
let leaderOpenWeeks = {};
function getOpenWeeks(club, currentWeek) {
  if (!leaderOpenWeeks[club.id]) {
    leaderOpenWeeks[club.id] = new Set(currentWeek ? [currentWeek] : []);
  }
  return leaderOpenWeeks[club.id];
}

function renderLeader(token) {
  const club = clubByLeaderToken(token);
  if (!club) {
    const w = document.createElement('div');
    w.className = 'container';
    w.innerHTML = '<div class="empty">클럽을 찾을 수 없습니다.<br><br><a href="#/admin" style="color:var(--primary); font-weight:600;">관리자로 이동 →</a></div>';
    return w;
  }

  const wrap = document.createElement('div');
  wrap.className = 'container';

  const memberships = membershipsOfClub(club.id).map(m => ({ m, u: findUser(m.user_id) })).filter(x => x.u);
  memberships.sort((a, b) => (a.u.name || '').localeCompare(b.u.name || ''));

  const prog = clubProgress(club);
  const period = getClubPeriod(club);
  const currentWeek = getCurrentWeek(club);
  const color = club.color || '#2A9D8F';

  const canToggleNumbers = club.entry_type === 'number' || club.entry_type === 'count';
  const showNumbers = localStorage.getItem('bys.v3.showNums.' + club.id) === '1';

  const mode = leaderViewMode[club.id] || 'today';
  const todayIsActive = isTodayScheduled(club, currentWeek);
  const remainingToday = (currentWeek && todayIsActive)
    ? memberships.filter(({ m }) => {
        const info = getTodaySlotInfo(club, m, currentWeek);
        return info.status === 'today' && !hasValue(info.entry);
      }).length
    : 0;
  const canBulkCheck = (club.entry_type || 'check') === 'check' && currentWeek && todayIsActive && remainingToday > 0;

  wrap.innerHTML =
    '<div class="leader-topbar">' +
      '<a href="#/admin">← 관리자로</a>' +
      '<a href="#/board/' + escapeHtml(club.leader_token || '') + '" style="margin-left:auto;">전체 현황판 보기 →</a>' +
    '</div>' +
    '<div class="leader-header">' +
      '<div class="title-row">' +
        '<div class="title-dot" style="background:' + escapeHtml(color) + '"></div>' +
        '<h1>' + escapeHtml(club.name || '') + '</h1>' +
      '</div>' +
      '<div class="meta">' +
        (period.start ? '<b>' + fmtDateFull(period.start) + '</b> ~ <b>' + fmtDateFull(period.end) + '</b>' : '기간 미설정') +
        ' · ' + getFreqLabel(club) +
        (club.leader_name ? ' · 리더 ' + escapeHtml(club.leader_name) : '') +
        (currentWeek ? '<span class="current-week-badge" style="background:' + escapeHtml(color) + '22; color:' + escapeHtml(color) + '">현재 W' + currentWeek + '</span>' : '') +
      '</div>' +
      '<div class="progress-lg">' +
        '<div class="progress"><div class="progress-fill" style="width:' + prog.pct + '%; background:' + escapeHtml(color) + '"></div></div>' +
        '<div class="pct-big" style="color:' + escapeHtml(color) + '">' + prog.pct + '%</div>' +
      '</div>' +
    '</div>' +
    '<div class="view-tabs">' +
      '<button class="tab-btn' + (mode === 'today' ? ' active' : '') + '" data-mode="today">오늘 체크</button>' +
      '<button class="tab-btn' + (mode === 'all' ? ' active' : '') + '" data-mode="all">전체보기</button>' +
    '</div>' +
    (mode === 'today'
      ? (
        (currentWeek && todayIsActive ?
          '<div class="today-heading">' +
            ((club.entry_type || 'check') === 'check' ? '오늘 전체 체크' : '오늘') +
            ' <span class="today-heading-date">- ' + fmtDateMonthDayWeekdayKR(new Date()) + '</span>' +
          '</div>' : '') +
        (canBulkCheck ? '<div class="btn-row"><button class="btn primary small" id="bulk-check-today">체크하기 (' + remainingToday + '명 남음)</button></div>' : '') +
        renderTodayList(club, memberships, showNumbers, currentWeek, todayIsActive)
      )
      : (
        (canToggleNumbers ?
          '<div class="toggle-row">' +
            '<label><input type="checkbox" id="show-nums"' + (showNumbers ? ' checked' : '') + '> 셀에 숫자 표시</label>' +
          '</div>' : '') +
        '<div id="weeks-wrap"></div>'
      )
    );

  if (mode === 'all') {
    const weeksWrap = wrap.querySelector('#weeks-wrap');
    const openWeeks = getOpenWeeks(club, currentWeek);
    for (let w = 1; w <= 8; w++) {
      weeksWrap.appendChild(renderWeekSection(club, w, memberships, showNumbers, currentWeek, openWeeks));
    }
  }

  // Tab switching
  wrap.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      leaderViewMode[club.id] = btn.dataset.mode;
      route();
    });
  });

  // Cell interaction (covers both the 오늘 체크 cell and the 전체보기 table)
  wrap.addEventListener('click', async (e) => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const mid = cell.dataset.mid;
    const week = parseInt(cell.dataset.week, 10);
    const slot = parseInt(cell.dataset.slot, 10);
    const m = findMembership(mid);
    if (!m) return;
    await handleCellClick(club, m, week, slot, wrap);
  });

  const toggle = wrap.querySelector('#show-nums');
  if (toggle) {
    toggle.addEventListener('change', () => {
      localStorage.setItem('bys.v3.showNums.' + club.id, toggle.checked ? '1' : '0');
      route();
    });
  }

  const bulkBtn = wrap.querySelector('#bulk-check-today');
  if (bulkBtn) {
    bulkBtn.addEventListener('click', () => bulkCheckToday(club, memberships, currentWeek));
  }

  return wrap;
}

// 오늘 체크: one big tap target per member for today's slot only, instead of the full 8-week table
function renderTodayList(club, memberships, showNumbers, currentWeek, todayIsActive) {
  if (!currentWeek) {
    return '<div class="empty" style="padding:40px 20px;">현재 진행 기간이 아니에요.<br>"전체보기"에서 지난 기록을 확인할 수 있어요.</div>';
  }
  if (!todayIsActive) {
    const days = (club.fixed_days || []).slice().sort((a, b) => a - b).map(d => WEEKDAY_LABELS[d]).join('/');
    return '<div class="empty" style="padding:40px 20px;">오늘은 활동 요일이 아니에요.' + (days ? '<br>(활동 요일: ' + escapeHtml(days) + ')' : '') + '</div>';
  }

  const type = club.entry_type || 'check';
  const rows = memberships.map(({ m, u }) => {
    const info = getTodaySlotInfo(club, m, currentWeek);
    const mp = membershipProgress(m, club);
    let cellHtml;
    if (info.status === 'week-complete') {
      cellHtml = '<div class="today-note done">✅ 이번 주<br>완료</div>';
    } else {
      const filled = hasValue(info.entry);
      let display;
      if (filled) {
        const v = info.entry.value;
        if (type === 'number') display = showNumbers ? String(v.n) : '<span class="cell-value circle"></span>';
        else if (type === 'count') display = showNumbers ? String(v.count) : '<span class="cell-value circle"></span>';
        else display = '<span class="cell-value circle"></span>';
      } else {
        display = '<span class="cell-value pending"></span>';
      }
      cellHtml = '<button class="cell today-cell ' + (filled ? 'done' : '') + '" ' +
        'data-mid="' + m.id + '" data-week="' + info.week + '" data-slot="' + info.slot + '">' +
        (filled && (type === 'number' || type === 'count') && showNumbers
          ? '<span class="cell-value">' + escapeHtml(display) + '</span>'
          : display) +
      '</button>';
    }
    return '<div class="today-row">' +
      '<div class="name">' + escapeHtml(u.name) + '</div>' +
      cellHtml +
      '<div class="m-progress">전체 <b>' + mp.filled + '</b>/' + mp.total + '</div>' +
    '</div>';
  }).join('');

  return '<div class="today-list">' + (rows || '<div class="empty" style="padding:20px;">아직 멤버가 없습니다</div>') + '</div>';
}

// Bulk-mark every remaining member as done for today in one tap (check-type clubs only)
async function bulkCheckToday(club, memberships, currentWeek) {
  const ts = new Date().toISOString();
  const date = dateStr(new Date());
  const targets = [];
  memberships.forEach(({ m }) => {
    const info = getTodaySlotInfo(club, m, currentWeek);
    if (info.status === 'today' && !hasValue(info.entry)) {
      targets.push({ membership: m, week: info.week, slot: info.slot });
    }
  });
  if (!targets.length) { toast('오늘 체크할 대상이 없어요'); return; }

  targets.forEach(({ membership, week, slot }) => {
    const existing = cache.entries.find(e =>
      e.membership_id === membership.id && e.week === week && e.slot === slot
    );
    if (existing) { existing.value = { state: 'done' }; existing.date = date; existing.updated_at = ts; }
    else cache.entries.push({
      id: 'temp_' + Math.random().toString(36).slice(2, 9),
      membership_id: membership.id, week, slot, date, value: { state: 'done' }, updated_at: ts,
    });
    pendingAdd({ action: 'upsert', membership_id: membership.id, week, slot, date, value: { state: 'done' }, ts });
  });

  route({ preserveScroll: true });
  dbg('일괄 체크 시작: ' + targets.length + '명');

  const results = await Promise.all(targets.map(({ membership, week, slot }) =>
    sb.from('entries').upsert(
      { membership_id: membership.id, week, slot, date, value: { state: 'done' }, updated_at: ts },
      { onConflict: 'membership_id,week,slot' }
    )
  ));
  let anyErr = false;
  results.forEach((r, i) => {
    const { membership, week, slot } = targets[i];
    if (r.error) { anyErr = true; dbg('❌ 일괄 체크 실패 W' + week + 'S' + slot + ': ' + r.error.message); }
    else pendingRemove({ membership_id: membership.id, week, slot, ts });
  });
  flashSave(anyErr);
  toast(anyErr ? '일부 저장 실패 (큐 보관)' : targets.length + '명 오늘 체크 완료', anyErr);
}

function renderWeekSection(club, week, memberships, showNumbers, currentWeek, openWeeks) {
  const section = document.createElement('div');
  const isOpen = openWeeks.has(week);
  section.className = 'week-section' + (isOpen ? ' open' : '');
  const range = getWeekRange(club, week);
  const wp = clubWeekProgress(club, week);
  const isCurrent = week === currentWeek;
  const color = club.color || '#2A9D8F';

  const memberBlocks = memberships.map(({ m, u }) => {
    const mp = membershipWeekProgress(m, club, week);
    const cells = renderCellRow(club, m, week, showNumbers);
    return '<div class="member-block">' +
      '<div class="name-col">' +
        '<div class="name">' + escapeHtml(u.name) + '</div>' +
        '<div class="m-progress"><b>' + mp.filled + '</b>/' + mp.total + '</div>' +
      '</div>' +
      '<div class="cell-row">' + cells + '</div>' +
    '</div>';
  }).join('');

  section.innerHTML =
    '<div class="week-head' + (isCurrent ? ' is-current' : '') + '">' +
      '<div class="week-head-left">' +
        '<span class="week-caret">▶</span>' +
        '<span class="w-label">W' + week + '</span>' +
        '<span class="w-dates">' + fmtDateWithDay(range.start) + ' ~ ' + fmtDateWithDay(range.end) + '</span>' +
      '</div>' +
      '<div class="w-progress"><b>' + wp.filled + '</b> / ' + wp.total + '</div>' +

function renderCellRow(club, membership, week, showNumbers) {
  const freq = club.frequency_per_week || 7;
  let cells = '';
  for (let s = 0; s < freq; s++) {
    const entry = entryOf(membership.id, week, s);
    const filled = hasValue(entry);
    const slotDate = getSlotDate(club, week, s, entry);

    let display = '';
    if (filled) {
      const v = entry.value;
      if (club.entry_type === 'number') {
        display = showNumbers ? String(v.n) : '<span class="cell-value circle"></span>';
      } else if (club.entry_type === 'count') {
        display = showNumbers ? String(v.count) : '<span class="cell-value circle"></span>';
      } else {
        display = '<span class="cell-value circle"></span>';
      }
    } else {
      display = '<span class="cell-value pending"></span>';
    }
    const dateLabel = slotDate ? fmtDateWithDay(slotDate) : SLOT_FALLBACK_LABELS[s % 7];

    cells += '<button class="cell ' + (filled ? 'done' : '') + '" ' +
      'data-mid="' + membership.id + '" data-week="' + week + '" data-slot="' + s + '">' +
      (filled && (club.entry_type === 'number' || club.entry_type === 'count') && showNumbers
        ? '<span class="cell-value">' + escapeHtml(display) + '</span>'
        : display) +
      '<span class="cell-date">' + dateLabel + '</span>' +
    '</button>';
  }
  return cells;
}

// Read-only, shareable with every member — one page, whole-club status at a glance.
function renderBoard(token) {
  const club = clubByLeaderToken(token);

  memberships.sort((a, b) => (a.u.name || '').localeCompare(b.u.name || ''));

  const prog = clubProgress(club);
  const period = getClubPeriod(club);
  const currentWeek = getCurrentWeek(club);
  const color = club.color || '#2A9D8F';

  const rows = memberships.map(({ m, u }) => {
    const mp = membershipProgress(m, club);

        '<div class="progress"><div class="progress-fill" style="width:' + mp.pct + '%; background:' + escapeHtml(color) + '"></div></div>' +
        '<div class="board-pct" style="color:' + escapeHtml(color) + '">' + mp.pct + '%</div>' +

    '<div class="leader-header">' +
      '<div class="title-row">' +
        '<div class="title-dot" style="background:' + escapeHtml(color) + '"></div>' +
        '<h1>' + escapeHtml(club.name || '') + '</h1>' +
      '</div>' +
      '<div class="meta">' +
        '전체 현황판' +
        (period.start ? ' · <b>' + fmtDateFull(period.start) + '</b> ~ <b>' + fmtDateFull(period.end) + '</b>' : '') +
        (currentWeek ? '<span class="current-week-badge" style="background:' + escapeHtml(color) + '22; color:' + escapeHtml(color) + '">현재 W' + currentWeek + '</span>' : '') +
      '</div>' +
      '<div class="progress-lg">' +
        '<div class="progress"><div class="progress-fill" style="width:' + prog.pct + '%; background:' + escapeHtml(color) + '"></div></div>' +
        '<div class="pct-big" style="color:' + escapeHtml(color) + '">' + prog.pct + '%</div>' +
      '</div>' +
    '</div>' +
    '<div class="board-list">' + (rows || '<div class="empty" style="padding:20px;">아직 멤버가 없습니다</div>') + '</div>';

// ============ CELL CLICK HANDLERS ============
async function handleCellClick(club, membership, week, slot, wrap) {
  const type = club.entry_type || 'check';
  if (type === 'check') return handleCheckClick(club, membership, week, slot);
  if (type === 'number') return openNumberModal(club, membership, week, slot);
  if (type === 'count') return openCountModal(club, membership, week, slot);
}

async function handleCheckClick(club, membership, week, slot) {
  const entry = entryOf(membership.id, week, slot);
  const filled = hasValue(entry);
  if (filled) return saveEntry(club, membership, week, slot, null); // clear
  return saveEntry(club, membership, week, slot, { state: 'done' });
}

function openNumberModal(club, membership, week, slot) {
  const entry = entryOf(membership.id, week, slot);
  const current = entry && entry.value && typeof entry.value.n === 'number' ? entry.value.n : '';
  const slotDate = getSlotDate(club, week, slot, entry);
  const unit = club.unit || '';

  const dateInputHtml = (!isDeterministicSchedule(club)) ?
    '<div class="form-group">' +
      '<label>날짜 (선택사항)</label>' +
      '<input type="date" id="nm-date" value="' + (slotDate ? dateStr(slotDate) : dateStr(new Date())) + '">' +
      '<div class="hint">체크한 실제 날짜</div>' +
    '</div>' : '';

  showModal(findUser(membership.user_id).name + ' · W' + week + ' 슬롯' + (slot + 1),
    '<div class="form-group">' +
      '<label>값 ' + (unit ? '(' + escapeHtml(unit) + ')' : '') + '</label>' +
      '<input type="number" step="0.1" class="number-input-large" id="nm-value" value="' + escapeHtml(current) + '" autofocus>' +
    '</div>' +
    dateInputHtml,
    {
      cancelText: '비우기',
      onSave: async (bg) => {
        const raw = bg.querySelector('#nm-value').value.trim();
        if (!raw) {
          await saveEntry(club, membership, week, slot, null);
          return true;
        }
        const n = parseFloat(raw);
        if (isNaN(n)) { toast('숫자를 입력하세요', true); return false; }
        const dateEl = bg.querySelector('#nm-date');
        const date = dateEl ? dateEl.value : null;
        await saveEntry(club, membership, week, slot, { n }, date);
        return true;
      }
    }
  );
  // Repurpose cancel to clear
  setTimeout(() => {
    const cancelBtn = document.querySelector('.modal-bg [data-cancel]');
    if (cancelBtn) {
      const orig = cancelBtn.onclick;
      cancelBtn.onclick = null;
      cancelBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await saveEntry(club, membership, week, slot, null);
        cancelBtn.closest('.modal-bg').remove();
      });
    }
  }, 40);
}

function openCountModal(club, membership, week, slot) {
  const entry = entryOf(membership.id, week, slot);
  let count = entry && entry.value && typeof entry.value.count === 'number' ? entry.value.count : 0;
  const slotDate = getSlotDate(club, week, slot, entry);

  const dateInputHtml = (!isDeterministicSchedule(club)) ?
    '<div class="form-group">' +
      '<label>날짜</label>' +
      '<input type="date" id="cm-date" value="' + (slotDate ? dateStr(slotDate) : dateStr(new Date())) + '">' +
    '</div>' : '';

  showModal(findUser(membership.user_id).name + ' · W' + week + ' 슬롯' + (slot + 1),
    '<div class="count-controls">' +
      '<button class="count-btn" id="cm-minus">−</button>' +
      '<div class="count-display" id="cm-count">' + count + '</div>' +
      '<button class="count-btn primary" id="cm-plus">+</button>' +
    '</div>' +
    dateInputHtml,
    {
      cancelText: '비우기',
      onMount: (bg) => {
        const display = bg.querySelector('#cm-count');
        bg.querySelector('#cm-plus').addEventListener('click', () => { count++; display.textContent = count; });
        bg.querySelector('#cm-minus').addEventListener('click', () => { if (count > 0) count--; display.textContent = count; });
      },
      onSave: async (bg) => {
        if (count <= 0) {
          await saveEntry(club, membership, week, slot, null);
        } else {
          const dateEl = bg.querySelector('#cm-date');
          const date = dateEl ? dateEl.value : null;
          await saveEntry(club, membership, week, slot, { count }, date);
        }
        return true;
      }
    }
  );
  setTimeout(() => {
    const cancelBtn = document.querySelector('.modal-bg [data-cancel]');
    if (cancelBtn) {
      cancelBtn.onclick = null;
      cancelBtn.addEventListener('click', async () => {
        await saveEntry(club, membership, week, slot, null);
        cancelBtn.closest('.modal-bg').remove();
      });
    }
  }, 40);
}

// ============ SAVE ENTRY ============
async function saveEntry(club, membership, week, slot, value, dateOverride) {
  const ts = new Date().toISOString();
  const isDelete = value === null;

  // 고정/매일(주 7회) 모드는 슬롯 위치로 날짜가 정해져 있고, 진짜 자유 모드만 "체크한 시점의 날짜"를 붙인다
  let date = dateOverride || null;
  if (!isDelete && !date) {
    if (isDeterministicSchedule(club)) {
      const d = getSlotDate(club, week, slot, null);
      date = d ? dateStr(d) : null;
    } else {
      const existing = entryOf(membership.id, week, slot);
      date = existing && existing.date ? existing.date : dateStr(new Date());
    }
  }

  // Optimistic cache update
  if (isDelete) {
    cache.entries = cache.entries.filter(e =>
      !(e.membership_id === membership.id && e.week === week && e.slot === slot)
    );
  } else {
    const existing = cache.entries.find(e =>
      e.membership_id === membership.id && e.week === week && e.slot === slot
    );
    if (existing) { existing.value = value; existing.date = date; existing.updated_at = ts; }
    else cache.entries.push({
      id: 'temp_' + Math.random().toString(36).slice(2, 9),
      membership_id: membership.id, week, slot, date, value, updated_at: ts,
    });
  }

  // Re-render leader view (fast, in-memory) without jumping the scroll position
  route({ preserveScroll: true });

  // Pending queue
  const op = { action: isDelete ? 'delete' : 'upsert', membership_id: membership.id, week, slot, date, value, ts };
  pendingAdd(op);
  dbg((isDelete ? '삭제' : '저장') + ' 시작: W' + week + 'S' + slot);

  try {
    if (isDelete) {
      const { error } = await sb.from('entries').delete()
        .eq('membership_id', membership.id).eq('week', week).eq('slot', slot);
      if (error) throw error;
    } else {
      const { error } = await sb.from('entries').upsert({
        membership_id: membership.id, week, slot, date, value, updated_at: ts,
      }, { onConflict: 'membership_id,week,slot' });
      if (error) throw error;
    }
    pendingRemove(op);
    dbg('✅ ' + (isDelete ? '삭제' : '저장') + ' 완료');
    flashSave();
  } catch (err) {
    console.error(err);
    dbg('❌ ' + (err.message || err));
    flashSave(true);
    toast('저장 실패 (큐 보관): ' + (err.message || err), true);
  }
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', route);
if (document.readyState !== 'loading') route();
</script>
